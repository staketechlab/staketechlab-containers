# Info widgets shown in the header area.
# Docs: https://gethomepage.dev/configs/info-widgets/

- resources:
    cpu: true
    memory: true
    disk: /

- datetime:
    text_size: xl
    format:
      timeStyle: short

# Weather for YOUR location — uncomment, set lat/lon, and it appears.
